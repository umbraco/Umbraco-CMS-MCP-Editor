name: Azure hosted MCP

on:
  push:
    branches: [dev, main]
    paths:
      - "src/hosted/**"
      - "src/collections.ts"
      - "src/worker.ts"
      - "Dockerfile"
      - "tsup.azure.config.ts"
      - "infra/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/azure-hosted.yml"
  pull_request:
    paths:
      - "src/hosted/**"
      - "src/collections.ts"
      - "Dockerfile"
      - "tsup.azure.config.ts"
      - "infra/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/azure-hosted.yml"
  workflow_dispatch:

jobs:
  build-azure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:azure
      - name: Smoke-start Azure host
        env:
          UMBRACO_BASE_URL: https://example.invalid
          UMBRACO_OAUTH_CLIENT_ID: umbraco-editor-mcp-hosted
          COOKIE_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          PORT: "8080"
          HOST: "127.0.0.1"
        run: |
          node --import ./src/hosted/hooks/register-cloudflare-shim.mjs ./dist-azure/server.js &
          pid=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health; then
              kill $pid
              wait $pid || true
              exit 0
            fi
            sleep 1
          done
          kill $pid || true
          echo "Health check failed"
          exit 1

  docker:
    runs-on: ubuntu-latest
    needs: build-azure
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t umbraco-mcp-editor:ci .
