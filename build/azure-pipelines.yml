trigger:
  branches:
    include:
    - main
    - v17/main
    - v17/dev
    - feature/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: nodeVersion
    value: '22.x'
  - name: myGetRegistry
    value: 'https://www.myget.org/F/umbracoprereleases/npm/'
  # npm-type service connection in ADO holding the MyGet API key.
  - name: myGetServiceConnection
    value: 'NPM MyGet Prereleases Feed'

stages:
- stage: BuildAndTest
  displayName: 'Build'
  jobs:
  - job: Build
    displayName: 'Build Package'
    steps:
    - task: NodeTool@0
      displayName: 'Use Node.js $(nodeVersion)'
      inputs:
        versionSpec: '$(nodeVersion)'

    - task: Cache@2
      displayName: 'Cache node_modules'
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
          npm
        path: 'node_modules'

    - script: npm ci
      displayName: 'Install dependencies'

    - script: npm run compile
      displayName: 'Type-check TypeScript'

    - script: npm run build
      displayName: 'Build TypeScript'

    - script: npm pack --pack-destination $(Build.ArtifactStagingDirectory)
      displayName: 'Create NPM package'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish NPM package to artifacts'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'npm-package'

# Prereleases on both lines go to the private MyGet feed (umbracoprereleases).
# Public npm publishing is enabled below on this line (Deploy_Npm, gated to
# refs/heads/v17/main and scoped to lts-17* dist-tags).
- stage: Deploy_Prerelease
  displayName: Prerelease (MyGet)
  condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/v17/main'))
  dependsOn:
    - BuildAndTest
  jobs:
    - job: Publish
      displayName: Push to MyGet
      steps:
        - checkout: self
        - task: NodeTool@0
          displayName: 'Use Node.js $(nodeVersion)'
          inputs:
            versionSpec: '$(nodeVersion)'
        - download: current
          artifact: 'npm-package'
        - bash: echo "registry=$(myGetRegistry)" >> .npmrc
          workingDirectory: $(Pipeline.Workspace)/npm-package
          displayName: Point .npmrc at MyGet feed
        - task: npmAuthenticate@0
          displayName: Authenticate with MyGet
          inputs:
            workingFile: $(Pipeline.Workspace)/npm-package/.npmrc
            customEndpoint: '$(myGetServiceConnection)'
        - script: |
            # Find the first .tgz file in the current directory
            files=( ./*.tgz )

            # Extract version from package.json in the tarball
            tar -tf "${files[0]}" | grep package/package.json | head -1 | xargs tar -xf "${files[0]}" --strip-components=1
            version=$(node -p "require('./package.json').version")

            # Determine release channel from the version suffix.
            if [[ "${version}" == *"alpha"* ]]; then
              channel="alpha"
            elif [[ "${version}" == *"beta"* ]]; then
              channel="beta"
            elif [[ "${version}" == *"rc"* ]]; then
              channel="rc"
            else
              channel="latest"
            fi

            # Scope the v17 (LTS) line to lts-17* dist-tags so it never claims the
            # mainline `latest`/prerelease tags (which belong to the current major).
            if [[ "${BUILD_SOURCEBRANCH}" == "refs/heads/v17/main" ]]; then
              if [ "$channel" = "latest" ]; then
                tag="lts-17"
              else
                tag="lts-17-${channel}"
              fi
            else
              tag="$channel"
            fi

            echo "Publishing version ${version} to MyGet ($(myGetRegistry)) with tag ${tag}"
            if ! npm publish "${files[0]}" --registry $(myGetRegistry) --tag "${tag}"; then
              echo "##vso[task.logissue type=error]MyGet publish failed for version ${version}"
              exit 1
            fi
          displayName: Push package to MyGet
          workingDirectory: $(Pipeline.Workspace)/npm-package

# Public npm release — enabled on the v17 (LTS) line. Scoped to lts-17*
# dist-tags via the same pattern as Deploy_Prerelease above, so a v17 stable
# release can never claim public npm's `latest` (which belongs to the current
# major, released from main).
- stage: Deploy_Npm
  displayName: Npm release
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/v17/main'))
  dependsOn:
    - BuildAndTest
  jobs:
    - job: Publish
      displayName: Push to NPM
      steps:
        - checkout: self
        - task: NodeTool@0
          displayName: 'Use Node.js $(nodeVersion)'
          inputs:
            versionSpec: '$(nodeVersion)'
        - download: current
          artifact: 'npm-package'
        - bash: echo "registry=https://registry.npmjs.org" >> .npmrc
          workingDirectory: $(Pipeline.Workspace)/npm-package
          displayName: Add registry to .npmrc
        - task: npmAuthenticate@0
          displayName: Authenticate with npm
          inputs:
            workingFile: $(Pipeline.Workspace)/npm-package/.npmrc
            customEndpoint: "NPM - Umbraco Backoffice"
        - script: |
            # Setup temp npm project to load in defaults from the local .npmrc
            npm init -y

            # Find the first .tgz file in the current directory
            files=( ./*.tgz )

            # Extract version from package.json in the tarball
            tar -tf "${files[0]}" | grep package/package.json | head -1 | xargs tar -xf "${files[0]}" --strip-components=1
            version=$(node -p "require('./package.json').version")

            # Determine release channel from version
            if [[ "${version}" == *"alpha"* ]]; then
              channel="alpha"
            elif [[ "${version}" == *"beta"* ]]; then
              channel="beta"
            elif [[ "${version}" == *"rc"* ]]; then
              channel="rc"
            else
              channel="latest"
            fi

            # Scope the v17 (LTS) line to lts-17* dist-tags so it never claims
            # the mainline `latest`/prerelease tags (which belong to the
            # current major). This stage only ever runs on v17/main.
            if [ "$channel" = "latest" ]; then
              channel="lts-17"
            else
              channel="lts-17-${channel}"
            fi

            echo "Publishing version ${version} with tag ${channel}"
            if ! npm publish "${files[0]}" --tag $channel --access public; then
              echo "##vso[task.logissue type=error]npm publish failed for version ${version}"
              exit 1
            fi
          displayName: Push to npm with dynamic tagging
          workingDirectory: $(Pipeline.Workspace)/npm-package

# The MCP Registry release stage requires a server.json in the repo root
